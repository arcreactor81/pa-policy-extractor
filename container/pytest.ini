[pytest]
# Container-side golden tests. These run in GitHub Actions (CI), NOT on the slow
# local machine. They import the VERBATIM-loaded notebook logic + the new
# aggregation/explainability code from pipeline.core / pipeline.explain with all
# heavy deps (torch/docling/surya/google-genai) stubbed in tests/conftest.py.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    docling: tests that require the real docling package (skipped when absent).
