# Regenerate package-lock.json in the cloud — RUN MANUALLY AFTER A
# package.json CHANGE.
#
# WHY: the lockfile IS committed (so ci.yml/deploy.yml run `npm ci` —
# reproducible, integrity-pinned installs), but the author doesn't run npm on
# their (slow) local machine, so whenever package.json changes the lockfile
# must be regenerated on a GitHub runner — which is what this workflow does.
#
# HOW TO USE (the author runs this after changing package.json):
#   1. Go to the repo's "Actions" tab.
#   2. Pick the "gen-lockfile" workflow in the left sidebar.
#   3. Click "Run workflow" (uses the default branch, or pick another).
#   4. The job runs `npm install --package-lock-only` and commits the resulting
#      package-lock.json straight back to the branch it ran on.
#
# AFTER THAT: the refreshed package-lock.json is committed, and ci.yml /
# deploy.yml keep using `npm ci` against it (they fall back to `npm install`
# only if the lockfile were ever missing). No further manual steps — re-run
# this whenever package.json changes.
#
# SAFETY: manual trigger only (workflow_dispatch — never runs on push/PR), and a
# least-privilege token (permissions: contents: write, nothing else).
name: gen-lockfile

on:
  workflow_dispatch:

# Least privilege: only the permission needed to push the lockfile commit.
permissions:
  contents: write

# Don't let two manual runs race to commit the lockfile.
concurrency:
  group: gen-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gen-lockfile:
    name: generate + commit package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate package-lock.json (metadata only, no node_modules)
        # --package-lock-only resolves the full dependency tree and writes the
        # lockfile WITHOUT downloading/installing packages into node_modules —
        # fast, and all we need to commit.
        run: npm install --package-lock-only

      - name: Commit and push the lockfile
        # Uses the workflow's GITHUB_TOKEN (scoped by `permissions: contents:
        # write` above). If package-lock.json is unchanged, exit cleanly without
        # an empty commit. NOTE: `git status --porcelain`, not `git diff` — on
        # the FIRST run the lockfile is UNTRACKED and `git diff --quiet` is
        # blind to untracked files (it would exit 0 and silently skip the only
        # commit that matters).
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate package-lock.json (keeps 'npm ci' installs pinned)"
          git push
