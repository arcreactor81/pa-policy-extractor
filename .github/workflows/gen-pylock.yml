# Generate container/constraints.txt in the cloud — RUN THIS MANUALLY.
#
# WHY: container/requirements.txt deliberately leaves most of the docling stack
# unpinned (over-pinning risks an unsatisfiable resolve — see its comments), so
# every fresh install re-resolves versions. This workflow performs ONE clean
# resolve on a GitHub runner and freezes the result to container/constraints.txt;
# consumers (the weekly real-stack CI job, or anyone installing the stack) then
# apply it with `pip install -r container/requirements.txt -c container/constraints.txt`
# for a reproducible, drift-free install. It is the Python sibling of
# gen-lockfile.yml (which does the same for package-lock.json).
#
# HOW TO USE (run it once, then re-run whenever requirements.txt changes or you
# deliberately want to pick up newer versions):
#   1. Go to the repo's "Actions" tab.
#   2. Pick the "gen-pylock" workflow in the left sidebar.
#   3. Click "Run workflow" (uses the default branch, or pick another).
#   4. The job installs container/requirements.txt exactly like the Dockerfile
#      (CPU torch first), runs `pip freeze`, and commits the resulting
#      container/constraints.txt straight back to the branch it ran on.
#
# SAFETY: manual trigger only (workflow_dispatch — never runs on push/PR), and a
# least-privilege token (permissions: contents: write, nothing else) — the same
# pattern as gen-lockfile.yml.
name: gen-pylock

on:
  workflow_dispatch:

# Least privilege: only the permission needed to push the constraints commit.
permissions:
  contents: write

# Don't let two manual runs race to commit the constraints file.
concurrency:
  group: gen-pylock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gen-pylock:
    name: generate + commit container/constraints.txt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean install of container/requirements.txt (CPU torch+torchvision first)
        # Mirrors container/Dockerfile: torch AND torchvision together as a
        # MATCHED PAIR from the CPU wheel index (Cloudflare Containers have no
        # GPU, the CUDA wheels would blow the runner's disk budget, and a
        # PyPI/CUDA torchvision next to a +cpu torch fails at import — freezing
        # that env would pin the breakage). The CPU index rides along as an
        # EXTRA index on the requirements resolve so torch/torchvision stay on
        # +cpu builds. Deliberately NO -c constraints here — this is the fresh
        # resolve being frozen.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r container/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Import gate (refuse to freeze a broken resolve)
        # Same hard gate as the Dockerfile / weekly CI job: never commit a
        # constraints.txt pinning a stack whose converter imports don't load.
        run: |
          python -c "import torch, torchvision; \
          from docling.document_converter import DocumentConverter; \
          from docling_surya import SuryaOcrOptions; \
          print('import gate OK: torch', torch.__version__, '| torchvision', torchvision.__version__)"

      - name: Freeze the resolved versions to container/constraints.txt
        # A constraints file (-c) pins versions WITHOUT adding requirements, so
        # freezing the whole env is safe: anything not named in requirements.txt
        # is simply a pinned transitive dep.
        run: |
          {
            echo "# Generated by .github/workflows/gen-pylock.yml — DO NOT EDIT BY HAND."
            echo "# pip freeze of a clean container/requirements.txt resolve"
            echo "# (ubuntu-latest, Python 3.12, CPU torch wheel index)."
            echo "# Apply: pip install -r container/requirements.txt -c container/constraints.txt"
            echo "# Refresh: re-run the gen-pylock workflow (Actions tab)."
            pip freeze
          } > container/constraints.txt

      - name: Commit and push the constraints file
        # Uses the workflow's GITHUB_TOKEN (scoped by `permissions: contents:
        # write` above). Stage first, then check the index: unlike gen-lockfile's
        # plain `git diff`, this also handles the very first run, where
        # constraints.txt is a brand-new untracked file.
        run: |
          git add container/constraints.txt
          if git diff --cached --quiet; then
            echo "container/constraints.txt is already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh container/constraints.txt (pinned python stack for the real-stack CI job)"
          git push
